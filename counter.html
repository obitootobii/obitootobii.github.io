<!DOCTYPE html>
<html>
<head>
    <title>Word Counter</title>
    <style>
        body { background-color: #0d1117; color: white; font-family: Arial; text-align: center; padding-top: 50px; }
        .box { background: #161b22; padding: 30px; border-radius: 10px; display: inline-block; width: 90%; max-width: 500px; border: 1px solid #30363d;}
        textarea { width: 100%; height: 150px; margin: 20px 0; background: #0d1117; color: white; padding: 10px; border-radius: 5px; border: 1px solid #30363d;}
        h1 { color: #58a6ff; }
        span { color: #2ea043; font-weight: bold; font-size: 20px;}
        a { color: #c9d1d9; display: block; margin-top: 20px; text-decoration: none;}
    </style>
</head>
<body>
    <div class="box">
        <h1>Word Counter</h1>
        <textarea id="txt" placeholder="Yahan type karein..."></textarea>
        <div>Words: <span id="words">0</span> | Characters: <span id="chars">0</span></div>
        <a href="index.html">← Back to Home</a>
    </div>
    <script>
        document.getElementById('txt').addEventListener('input', function() {
            let text = this.value;
            document.getElementById('chars').innerText = text.length;
            let words = text.trim().split(/\s+/).filter(w => w.length > 0);
            document.getElementById('words').innerText = words.length;
        });
    </script>
</body>
</html>
