<!DOCTYPE html>
<html>
<head>
    <title>Smart Text Summarizer</title>
    <style>
        body {
            background-color: #0d1117;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #161b22;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 600px;
            border: 1px solid #30363d;
        }
        h1 {
            color: #58a6ff;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background-color: #0d1117;
            color: #c9d1d9;
            font-size: 16px;
            resize: vertical;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        textarea:focus {
            outline: none;
            border-color: #58a6ff;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #2ea043;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            display: none;
            line-height: 1.6;
        }
        .label {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📝 Smart Summarizer</h1>
        <p style="color: #8b949e; font-size: 14px; text-align: center;">Lamba text daalein, hum usko chhota kar denge!</p>
        
        <textarea id="inputText" placeholder="Yahan apna lamba paragraph ya notes paste karein..."></textarea>
        
        <button onclick="summarizeText()">Summarize (Chhota Karein)</button>
        
        <div id="result">
            <div class="label">Aapka Summary:</div>
            <p id="summaryOutput"></p>
        </div>
    </div>

    <script>
        function summarizeText() {
            let text = document.getElementById('inputText').value;
            
            if (text.length < 50) {
                alert("Bhai, kam se kam 50 akshar ka text toh daalo!");
                return;
            }

            // Text ko sentences mein todna (full stop, question mark, exclamation mark se)
            let sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
            
            // Har sentence ke words count karna
            let scoredSentences = sentences.map(sentence => {
                let words = sentence.trim().split(/\s+/).length;
                return { text: sentence.trim(), score: words };
            });

            // Sentences ko unke word count ke hisaab se sort karna (bade sentences upar)
            scoredSentences.sort((a, b) => b.score - a.score);

            // Top 3 sabse bade sentences uthana
            let topSentences = scoredSentences.slice(0, 3).map(s => s.text);

            // Unko wapas original order mein lana (optional, par padhne mein acha lagta hai)
            let finalSummary = topSentences.join(" ");

            // Result dikhana
            document.getElementById('summaryOutput').innerText = finalSummary;
            document.getElementById('result').style.display = 'block';
        }
    </script>

</body>
</html>
