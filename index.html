<!DOCTYPE html>
<html>
<head>
    <title>My Smart Study Tools</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 450px;
        }
        .card {
            background-color: #1e1e24;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }
        h2 {
            color: #00d2ff;
            text-align: center;
            margin-top: 0;
        }
        /* Timer ka design */
        #timer-display {
            font-size: 50px;
            font-weight: bold;
            text-align: center;
            color: #ff4757;
            margin: 20px 0;
            font-family: monospace;
        }
        .btn-group {
            display: flex;
            justify-content: space-between;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 30%;
            transition: 0.3s;
        }
        .start { background-color: #2ed573; color: white; }
        .stop { background-color: #ff4757; color: white; }
        .reset { background-color: #747d8c; color: white; }
        
        /* To-Do List ka design */
        .input-group {
            display: flex;
            margin-bottom: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 8px 0 0 8px;
            border: 1px solid #444;
            background-color: #121212;
            color: white;
            font-size: 16px;
        }
        .add-btn {
            padding: 10px 15px;
            background-color: #00d2ff;
            color: black;
            border-radius: 0 8px 8px 0;
            width: auto;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background-color: #2b2b36;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-btn {
            background-color: transparent;
            color: #ff4757;
            font-size: 20px;
            padding: 0;
            width: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Timer Section -->
        <div class="card">
            <h2>Study Timer</h2>
            <div id="timer-display">25:00</div>
            <div class="btn-group">
                <button class="start" onclick="startTimer()">Start</button>
                <button class="stop" onclick="stopTimer()">Pause</button>
                <button class="reset" onclick="resetTimer()">Reset</button>
            </div>
        </div>

        <!-- To-Do List Section -->
        <div class="card">
            <h2>Aaj Ka Task (To-Do)</h2>
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="Naya task likhein...">
                <button class="add-btn" onclick="addTask()">+</button>
            </div>
            <ul id="taskList">
                <!-- Tasks yahan aayenge -->
            </ul>
        </div>
    </div>

    <script>
        // --- Timer Logic ---
        let time = 25 * 60; // 25 minute
        let timerInterval;
        const timerDisplay = document.getElementById('timer-display');

        function updateDisplay() {
            let minutes = Math.floor(time / 60);
            let seconds = time % 60;
            timerDisplay.innerText = `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }

        function startTimer() {
            if (timerInterval) return; // Agar pehle se chal raha hai toh kuch mat karo
            timerInterval = setInterval(() => {
                if (time > 0) {
                    time--;
                    updateDisplay();
                } else {
                    clearInterval(timerInterval);
                    alert("Time's up! Take a break.");
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function resetTimer() {
            stopTimer();
            time = 25 * 60;
            updateDisplay();
        }

        // --- To-Do List Logic ---
        function addTask() {
            const input = document.getElementById('taskInput');
            const taskText = input.value.trim();
            
            if (taskText !== "") {
                const ul = document.getElementById('taskList');
                const li = document.createElement('li');
                
                li.innerHTML = `
                    <span>${taskText}</span>
                    <button class="delete-btn" onclick="this.parentElement.remove()">✖</button>
                `;
                
                ul.appendChild(li);
                input.value = ""; // Input box khali karo
            }
        }
    </script>

</body>
    </html>
