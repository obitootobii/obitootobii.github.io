<!DOCTYPE html>
<html>
<head>
    <title>My Tools - Word Counter</title>
    <style>
        body {
            background-color: #1e1e24;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background-color: #2b2b36;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            color: #00d2ff;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #1e1e24;
            color: white;
            font-size: 16px;
            resize: none;
            margin-bottom: 20px;
        }
        .result-box {
            display: flex;
            justify-content: space-around;
            font-size: 18px;
            font-weight: bold;
            background-color: #1e1e24;
            padding: 15px;
            border-radius: 8px;
        }
        .result-box span {
            color: #00d2ff;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Word Counter</h1>
        <p>Neeche apna text likhein:</p>
        
        <textarea id="textInput" placeholder="Yahan type karein..."></textarea>
        
        <div class="result-box">
            <div>Words: <span id="wordCount">0</span></div>
            <div>Characters: <span id="charCount">0</span></div>
        </div>
    </div>

    <script>
        // Ye JavaScript ka code hai jo live count karega
        const textInput = document.getElementById('textInput');
        const wordCount = document.getElementById('wordCount');
        const charCount = document.getElementById('charCount');

        textInput.addEventListener('input', function() {
            // Characters ginnna
            let text = this.value;
            charCount.textContent = text.length;

            // Words ginna (space ke hisaab se)
            let words = text.trim().split(/\s+/).filter(word => word.length > 0);
            wordCount.textContent = words.length;
        });
    </script>

</body>
</html>>
